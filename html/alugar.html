    <title>Página Alugar Carro</title>
    </head>
    <body>
        <header></header>
        <main>
            <section class="header">
                <h5>RESERVA</h5>
                <h1>RESERVAR VEÍCULO</h1>
            </section>

            <section class="data_resume">
                <section class="data">
                    <form class="personal_data">
                        <div class="heading">
                            <h5>Dados Pessoais</h5>
                        </div>
                        <div class="name_cpf">
                            <div class="label_pack">
                                <label for="nome">NOME COMPLETO</label>
                                <input type="text" name="nome" placeholder="Seu nome" />
                            </div>
                            <div class="label_pack">
                                <label for="nome">CPF</label>
                                <input type="text" name="cpf" placeholder="000.000.000-00" />
                            </div>
                        </div>
                        <div class="email_phone">
                            <div class="label_pack">
                                <label for="nome">E-MAIL</label>
                                <input type="text" name="nome" placeholder="seuemail@gmail.com" />
                            </div>
                            <div class="label_pack">
                                <label for="nome">TELEFONE</label>
                                <input type="text" name="cpf" placeholder="(21) 00000-0000" />
                            </div>
                        </div>
                    </form>

                    <form class="booking_data">
                        <div class="heading">
                            <h5>Dados da Reserva</h5>
                        </div>
                        <div class="vehicle_local">
                            <div class="label_pack">
                                <label for="car_name">VEÍCULO</label>
                                <input type="text" name="car_name" placeholder="Aston Martin DB5" disabled/>
                            </div>
                            <div class="label_pack">
                                <label for="pickup">LOCAL DE RETIRADA</label>
                                <input type="text" name="pickup"/>
                            </div>
                        </div>
                        <div class="dates">
                            <div class="label_pack">
                                <label for="pickup_date">DATA DE RETIRADA</label>
                                <input type="text" name="pickup_date"/>
                            </div>
                            <div class="label_pack">
                                <label for="return_date">DATA DE DEVOLUÇÃO</label>
                                <input type="text" name="return_date"/>
                            </div>                                              
                        </div>
                        </div>
                    </form>

                    <button class="send_button">CONFIRMAR RESERVA</button>
                </section>

                <section class="resumo">
                    <h5>RESUMO</h5>
                    <div class="photo">
                        <img class="image" src="https://quatrorodas.abril.com.br/wp-content/uploads/2020/10/DB5-e-DBS-anos-1960-da-Aston-Martin-durante-teste-da-Revista-Quatro-Rodas._1-e1604179023489.jpg?quality=70&strip=info" alt="">
                        <p class="img_text">Aston Martin</p>
                    </div>
                    <div class="preview">
                        <div class="daily_value">
                            <p class="day_style">Diária</p>
                            <p class="value_style">R$ 3.200</p>
                        </div>
                        <div class="days">
                            <p class="day_style">Dias</p>
                            <p class="value_style">1</p>
                        </div>
                    </div>
                    <hr class="divider">
                    <div class="total_value">
                        <p class="value_total_style">Total</p>
                        <p class="total_style">R$ 3.200</p>
                    </div>
                </section>
            </section>
        </main>
    </body>
