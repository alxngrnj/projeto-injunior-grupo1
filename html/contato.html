<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/style-contato.css" />
        <link rel="stylesheet" href="../css/styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <title>Página de Contato</title>
    </head>
    <body>
        <header></header>
        <main>
            <section class="header">
                <h5>FALE CONOSCO</h5>
                <h1>CONTATO</h1>
            </section>

            <section class="contact_info">
                <form class="pack_contact">
                    <div class="personal_info">
                        <div class="label_pack">
                            <label for="nome">NOME</label>
                            <input type="text" name="nome" placeholder="Seu nome" />
                        </div>
                        <div class="label_pack">
                            <label for="e-mail">E-MAIL</label>
                            <input type="text" name="e-mail" placeholder="seu@email.com" />
                        </div>
                    </div>
                    <div class="topic">
                        <div class="label_pack">
                            <label for="assunto">ASSUNTO</label>
                            <input
                                type="text"
                                class="full_width"
                                name="assunto"
                                placeholder="Como podemos ajudar?"
                            />
                        </div>
                        <div class="label_pack">
                            <label for="mensagem">E-MAIL</label>
                            <textarea
                                name="mensagem"
                                placeholder="Descreva sua dúvida ou sugestão..."
                                style="resize: none"
                            ></textarea>
                        </div>
                    </div>
                    <button class="send_button">ENVIAR MENSAGEM</button>
                </form>

                <div class="company_info">
                    <div class="phone_info">
                        <div class="info_icon">
                            <img src="../assets/phone.png" alt="" />
                        </div>
                        <div class="info_text">
                            <h5>TELEFONE</h5>
                            <p>+55 (21) 99897-5787</p>
                        </div>
                    </div>
                    <div class="email_info">
                        <div class="info_icon">
                            <img src="../assets/email.png" alt="" />
                        </div>
                        <div class="info_text">
                            <h5>E-MAIL</h5>
                            <p>INcarrinho@gmail.com</p>
                        </div>
                    </div>
                    <div class="adress_info">
                        <div class="info_icon">
                            <img src="../assets/map.png" alt="" />
                        </div>
                        <div class="info_text">
                            <h5>ENDEREÇO</h5>
                            <p>Av. Gal. Milton Tavares de Souza, s/n</p>
                            <p>São Domingos, Niterói - RJ</p>
                            <p>CEP 24210-310</p>
                        </div>
                    </div>
                    <div class="time_info">
                        <div class="info_icon">
                            <img src="../assets/time.png" alt="" />
                        </div>
                        <div class="info_text">
                            <h5>HORÁRIO</h5>
                            <p>Seg-Sex: 9h - 19h</p>
                            <p>Sáb: 9h-14h</p>
                            <p>Dom: Fechado</p>
                        </div>
                    </div>
                    <div class="location">
                        <iframe
                            class="map_background"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3675.1871896190382!2d-43.133260199999995!3d-22.9064655!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x99817e444e692b%3A0xfd5e35fb577af2f5!2sUFF%20-%20Instituto%20de%20Computa%C3%A7%C3%A3o!5e0!3m2!1spt-BR!2sbr!4v1784316651908!5m2!1spt-BR!2sbr"
                            allowfullscreen=""
                            loading="lazy"
                        >
                        </iframe>
                        <div class="location_content">
                            <div class="location_icon">
                                <img src="../assets/mappoint.png" alt="" />
                            </div>
                            <div class="location_text">
                                <h5>Carr{In}nhos HQ</h5>
                                <p>Niterói, RJ</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer></footer>
        <script src="../js/script.js"></script>
    </body>
</html>
